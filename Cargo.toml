[package]
name = "deltastack"
version = "0.1.0"
edition = "2021"
description = "Automated eval-based research loop on top of zerostack (autoresearch core concept)"
license = "MIT"

[[bin]]
name = "deltastack"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
shlex = "1"

[dev-dependencies]
tempfile = "3"
